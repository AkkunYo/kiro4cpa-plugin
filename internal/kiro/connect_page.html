<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiro 账号连接与授权</title>
  <style>
    :root {
      --bg: #0f1117;
      --card-bg: #1a1d27;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --border: #2d3748;
      --success: #10b981;
      --error: #ef4444;
      --input-bg: #131620;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --text: #0f172a;
        --text-muted: #64748b;
        --primary: #4f46e5;
        --primary-hover: #4338ca;
        --border: #e2e8f0;
        --input-bg: #f1f5f9;
      }
    }
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 90vh;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 520px;
      padding: 32px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
      gap: 8px;
    }
    .tab-btn {
      background: none;
      border: none;
      padding: 10px 14px;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      font-size: 14px;
    }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .tab-pane {
      display: none;
    }
    .tab-pane.active {
      display: block;
    }
    .field {
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: var(--primary-hover);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .code-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      background: var(--input-bg);
      border: 1px dashed var(--border);
      text-align: center;
    }
    .code-val {
      font-size: 24px;
      font-family: monospace;
      letter-spacing: 2px;
      font-weight: bold;
      color: var(--primary);
      margin: 8px 0;
    }
    .status-msg {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }
    .status-msg.success {
      display: block;
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .status-msg.error {
      display: block;
      background: rgba(239, 68, 68, 0.1);
      color: var(--error);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .note {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <svg class="logo" viewBox="0 0 1200 1200" fill="none">
        <rect width="1200" height="1200" rx="260" fill="#9046FF"/>
        <path d="M398.554 818.914C316.315 1001.03 491.477 1046.74 620.672 940.156C658.687 1059.66 801.052 970.473 852.234 877.795C964.787 673.567 919.318 465.357 907.64 422.374C827.637 129.443 427.623 128.946 358.8 423.865C342.651 475.544 342.402 534.18 333.458 595.051C328.986 625.86 325.507 645.488 313.83 677.785C306.873 696.424 297.68 712.819 282.773 740.645C259.915 783.881 269.604 867.113 387.87 823.883L399.051 818.914H398.554Z" fill="white"/>
        <path d="M636.123 549.353C603.328 549.353 598.359 510.097 598.359 486.742C598.359 465.623 602.086 448.977 609.293 438.293C615.504 428.852 624.697 424.131 636.123 424.131C647.555 424.131 657.492 428.852 664.447 438.541C672.398 449.474 676.623 466.12 676.623 486.742C676.623 525.998 661.471 549.353 636.375 549.353H636.123Z" fill="#1A1A1A"/>
        <path d="M771.24 549.353C738.445 549.353 733.477 510.097 733.477 486.742C733.477 465.623 737.203 448.977 744.41 438.293C750.621 428.852 759.814 424.131 771.24 424.131C782.672 424.131 792.609 428.852 799.564 438.541C807.516 449.474 811.74 466.12 811.74 486.742C811.74 525.998 796.588 549.353 771.492 549.353H771.24Z" fill="#1A1A1A"/>
      </svg>
      <div>
        <h1>Kiro 账号连接与授权</h1>
        <div style="font-size: 12px; color: var(--text-muted);">CPA-Manager-Plus 凭据接入向导</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('builder')">Builder ID</button>
      <button class="tab-btn" onclick="switchTab('idc')">IAM IdC</button>
      <button class="tab-btn" onclick="switchTab('social')">Social 账号</button>
      <button class="tab-btn" onclick="switchTab('apikey')">API Key</button>
    </div>

    <!-- Tab 1: Builder ID -->
    <div id="pane-builder" class="tab-pane active">
      <div class="note" style="margin-bottom: 16px;">
        推荐个人开发者使用。通过 AWS SSO 官方设备代码流免密授权。
      </div>
      <button class="btn" id="btn-builder" onclick="startDeviceFlow('builder')">生成 AWS 授权码</button>
      <div id="device-box-builder" class="code-box" style="display: none;">
        <div>请复制以下验证码并在弹出的 AWS 页面输入：</div>
        <div class="code-val" id="user-code-builder"></div>
        <a id="auth-link-builder" href="#" target="_blank" class="btn" style="display: inline-block; text-decoration: none; margin-top: 8px;">打开 AWS 授权页面</a>
        <div class="note" style="margin-top: 8px;">授权完成后本页面将自动检测并同步凭据...</div>
      </div>
    </div>

    <!-- Tab 2: IAM IdC -->
    <div id="pane-idc" class="tab-pane">
      <div class="field">
        <label>Start URL (SSO 起始链接)</label>
        <input type="text" id="idc-start-url" placeholder="https://d-xxxx.awsapps.com/start">
      </div>
      <div class="field">
        <label>AWS Region</label>
        <input type="text" id="idc-region" value="us-east-1">
      </div>
      <button class="btn" id="btn-idc" onclick="startDeviceFlow('idc')">开始 IdC 授权</button>
      <div id="device-box-idc" class="code-box" style="display: none;">
        <div>请复制以下验证码并在弹出的 AWS 页面输入：</div>
        <div class="code-val" id="user-code-idc"></div>
        <a id="auth-link-idc" href="#" target="_blank" class="btn" style="display: inline-block; text-decoration: none; margin-top: 8px;">打开 AWS 授权页面</a>
        <div class="note" style="margin-top: 8px;">授权完成后本页面将自动检测并同步凭据...</div>
      </div>
    </div>

    <!-- Tab 3: Social -->
    <div id="pane-social" class="tab-pane">
      <div class="field">
        <label>Refresh Token (Google / GitHub)</label>
        <input type="text" id="social-token" placeholder="从 Kiro IDE 或 kiro.rs 获取的 refreshToken">
      </div>
      <div class="field">
        <label>Region</label>
        <input type="text" id="social-region" value="us-east-1">
      </div>
      <button class="btn" id="btn-social" onclick="submitDirect('social')">提交并保存凭据</button>
    </div>

    <!-- Tab 4: API Key -->
    <div id="pane-apikey" class="tab-pane">
      <div class="field">
        <label>Kiro API Key</label>
        <input type="text" id="api-key-val" placeholder="填入以 kiro- 开头的 API Key">
      </div>
      <button class="btn" id="btn-apikey" onclick="submitDirect('api_key')">提交并保存凭据</button>
    </div>

    <div id="status-msg" class="status-msg"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const state = params.get('state');
    let pollTimer = null;

    function switchTab(name) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('pane-' + name).classList.add('active');
    }

    function showStatus(msg, isError) {
      const el = document.getElementById('status-msg');
      el.textContent = msg;
      el.className = 'status-msg ' + (isError ? 'error' : 'success');
    }

    async function startDeviceFlow(kind) {
      const btn = document.getElementById('btn-' + kind);
      btn.disabled = true;
      btn.textContent = '正在获取授权码...';

      let body = { state, kind };
      if (kind === 'idc') {
        body.startUrl = document.getElementById('idc-start-url').value.trim();
        body.region = document.getElementById('idc-region').value.trim() || 'us-east-1';
        if (!body.startUrl) {
          showStatus('请输入 Start URL', true);
          btn.disabled = false;
          btn.textContent = '开始 IdC 授权';
          return;
        }
      }

      try {
        const res = await fetch('/plugins/kiro4cpa/api/device-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || '请求失败');

        document.getElementById('device-box-' + kind).style.display = 'block';
        document.getElementById('user-code-' + kind).textContent = data.userCode;
        const link = document.getElementById('auth-link-' + kind);
        link.href = data.verificationUriComplete || data.verificationUri;
        btn.textContent = '重新生成';
        btn.disabled = false;

        startPolling();
      } catch (err) {
        showStatus('发起授权失败: ' + err.message, true);
        btn.disabled = false;
        btn.textContent = '重试';
      }
    }

    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        try {
          const res = await fetch('/plugins/kiro4cpa/api/poll?state=' + encodeURIComponent(state));
          const data = await res.json();
          if (data.status === 'success') {
            clearInterval(pollTimer);
            showStatus('🎉 授权成功！凭据已关联，可返回 CPA 管理面板。', false);
          } else if (data.status === 'error') {
            clearInterval(pollTimer);
            showStatus('授权出错: ' + data.error, true);
          }
        } catch (e) {}
      }, 3000);
    }

    async function submitDirect(method) {
      const btn = document.getElementById(method === 'social' ? 'btn-social' : 'btn-apikey');
      btn.disabled = true;
      btn.textContent = '正在验证保存...';

      let body = { state, method };
      if (method === 'social') {
        body.refreshToken = document.getElementById('social-token').value.trim();
        body.region = document.getElementById('social-region').value.trim();
        if (!body.refreshToken) {
          showStatus('请输入 refreshToken', true);
          btn.disabled = false;
          btn.textContent = '提交并保存凭据';
          return;
        }
      } else {
        body.kiroApiKey = document.getElementById('api-key-val').value.trim();
        if (!body.kiroApiKey) {
          showStatus('请输入 Kiro API Key', true);
          btn.disabled = false;
          btn.textContent = '提交并保存凭据';
          return;
        }
      }

      try {
        const res = await fetch('/plugins/kiro4cpa/api/submit-credential', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || '保存失败');

        showStatus('🎉 凭据保存成功！可返回 CPA 管理面板。', false);
        btn.textContent = '已保存';
      } catch (err) {
        showStatus('保存失败: ' + err.message, true);
        btn.disabled = false;
        btn.textContent = '重试';
      }
    }
  </script>
</body>
</html>
